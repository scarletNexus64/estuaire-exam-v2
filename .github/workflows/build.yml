name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  construire:
    name: ${{ matrix.cible }}
    needs: verifier
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cible: windows
            chemin: build/windows/x64/runner/Release
          - os: macos-latest
            cible: macos
            chemin: build/macos/Build/Products/Release
          - os: ubuntu-latest
            cible: linux
            chemin: build/linux/x64/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Dépendances système Linux
        if: matrix.cible == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

      - run: flutter pub get

      - run: flutter build ${{ matrix.cible }} --release

      - uses: actions/upload-artifact@v4
        with:
          name: estuaire-examen-${{ matrix.cible }}
          path: ${{ matrix.chemin }}
          if-no-files-found: error
